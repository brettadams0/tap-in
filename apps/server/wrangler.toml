name = "tap-in-server"
main = "src/worker/index.ts"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://tap-in-omega.vercel.app,https://tap-in.vercel.app,http://localhost:5173,http://localhost:4173"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
